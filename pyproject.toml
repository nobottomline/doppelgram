[project]
name = "doppelgram"
version = "0.2.0"
description = "LLM agent in your own Telegram account that rates profiles in Telegram dating bots by your taste"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["telegram", "telethon", "llm", "agent", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
authors = [
    { name = "Great Love", email = "68994918+nobottomline@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "av>=14",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "qrcode>=8.2",
    "telethon>=1.45.0",
    "tzdata>=2025.2 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/nobottomline/doppelgram"
Issues = "https://github.com/nobottomline/doppelgram/issues"
Security = "https://github.com/nobottomline/doppelgram/security/policy"

[project.scripts]
doppelgram = "doppelgram.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The bots, prompts and messages are Russian: Cyrillic letters are intended, not look-alikes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Test helpers return many values; tests unpack what they need.
"tests/*" = ["RUF059"]
# Prompt texts: one paragraph per line reads better than wrapped fragments.
"src/doppelgram/brain.py" = ["E501"]
"src/doppelgram/conversation.py" = ["E501"]
"src/doppelgram/simulate.py" = ["E501"]
"src/doppelgram/lookup.py" = ["E501"]
"src/doppelgram/evaluate.py" = ["E501"]
